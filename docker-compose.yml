version: "3.11"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./outputs:/app/outputs

  frontend:
    build:
      context: ./frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - backend
